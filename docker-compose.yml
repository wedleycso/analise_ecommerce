services:
  postgres-db:
    image: postgres:18-alpine
    container_name: olist_postgres_container
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: olist_user
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - olist_db_data:/var/lib/postgresql
    restart: always

volumes:
  olist_db_data:
    driver: local